<div class="manage-candidates-page">
  <header class="page-header">
    <div>
      <h2>Manage Candidates</h2>
      <p class="page-copy">Review new candidate registrations and approve or reject pending accounts.</p>
    </div>
  </header>

  <section class="table-panel mat-elevation-z8">
    <table mat-table [dataSource]="dataSource" class="candidate-table">

      <!-- First Name Column -->
      <ng-container matColumnDef="first_name">
        <th mat-header-cell *matHeaderCellDef> First Name </th>
        <td mat-cell *matCellDef="let candidate"> {{candidate.first_name}} </td>
      </ng-container>

      <!-- Last Name Column -->
      <ng-container matColumnDef="last_name">
        <th mat-header-cell *matHeaderCellDef> Last Name </th>
        <td mat-cell *matCellDef="let candidate"> {{candidate.last_name}} </td>
      </ng-container>

      <!-- Email Column -->
      <ng-container matColumnDef="email">
        <th mat-header-cell *matHeaderCellDef> Email </th>
        <td mat-cell *matCellDef="let candidate"> {{candidate.email}} </td>
      </ng-container>

      <!-- Phone Column -->
      <ng-container matColumnDef="phone">
        <th mat-header-cell *matHeaderCellDef> Phone </th>
        <td mat-cell *matCellDef="let candidate"> {{candidate.phone}} </td>
      </ng-container>

      <!-- Actions Column -->
      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef> Actions </th>
        <td mat-cell *matCellDef="let candidate">
          <div class="action-buttons">
            <button mat-raised-button class="btn-approve" (click)="approveCandidate(candidate)">Approve</button>
            <button mat-raised-button class="btn-reject" (click)="rejectCandidate(candidate)">Reject</button>
          </div>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    </table>

    <mat-paginator [pageSizeOptions]="[5, 10, 20]"
                   showFirstLastButtons
                   aria-label="Select page of candidates">
    </mat-paginator>
  </section>
</div>
